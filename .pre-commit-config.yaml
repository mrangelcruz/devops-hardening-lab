# Pre-commit hooks: fast, local checks that run before every commit.
# Install: pip install pre-commit && pre-commit install
# Run manually against all files: pre-commit run --all-files

repos:
  # --- Secrets detection (non-negotiable, runs first) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Generic file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^ansible/inventory.*\.yml.*$ # dynamic inventory syntax isn't standard YAML doc structure in all linters
      - id: check-executables-have-shebangs

  # --- Terraform ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--framework terraform
          # Inline skips (same IDs as .checkov.yaml). The antonbabenko hook
          # does not run with cwd=repo root, so --config-file=.checkov.yaml
          # cannot be resolved reliably from this hook.
          - --args=--skip-check
          - --args=CKV_AWS_144,CKV_AWS_145,CKV_AWS_18,CKV2_AWS_62,CKV_AWS_126,CKV_AWS_135,CKV_AWS_382,CKV_AWS_130,CKV2_AWS_11,CKV2_AWS_12,CKV_AWS_355,CKV_AWS_286,CKV_AWS_287,CKV_AWS_288,CKV_AWS_289,CKV_AWS_290

  # --- Ansible ---
  - repo: https://github.com/ansible/ansible-lint
    rev: v24.12.2
    hooks:
      - id: ansible-lint
        files: ^ansible/playbooks/.*\.ya?ml$
        # Pin ansible-core to a version contemporaneous with this
        # ansible-lint release. Without this, pre-commit's isolated hook
        # venv resolves whatever ansible-core is latest (e.g. 2.19.x+),
        # which has restructured ansible.parsing.yaml.constructor and
        # breaks this ansible-lint version's imports at runtime
        # (ModuleNotFoundError). Bump both together when upgrading.
        additional_dependencies:
          - ansible-core==2.17.10

  # --- Company policy (Rego/conftest) ---
  # Single source of truth for the company_version tag/var format check --
  # runs identically here (local pre-commit) and in CI (ci.yml's
  # `pre-commit` job just calls `pre-commit run --all-files`, so it picks
  # these hooks up automatically, no separate hand-written CI logic to
  # drift out of sync). The Terraform-plan-JSON variant of this check
  # can't run here (no live AWS creds locally in this hook) -- that one
  # stays as a dedicated step in the `terraform-plan` CI job, which is
  # already the only place `terraform plan` runs against real AWS.
  - repo: local
    hooks:
      - id: conftest-verify
        name: conftest verify (Rego unit tests)
        entry: conftest verify --policy policy
        language: system
        pass_filenames: false
        always_run: true
      - id: conftest-ansible-company-version
        name: conftest test (Ansible company_version format)
        entry: conftest test --policy policy
        language: system
        files: ^ansible/playbooks/.*\.ya?ml$

  # --- Shell ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # --- Python (if/when any scripting is added) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
