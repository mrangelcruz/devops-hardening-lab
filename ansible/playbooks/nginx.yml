---
# Idempotent nginx install/config -- the "correct" version, contrasted
# against the intentionally-broken variant documented in docs/DRIFT-
# DETECTION.md and this repo's sibling daily-reps lab. Provided here as
# a working baseline for the SSM instance this lab's Terraform creates.

- name: Install and start nginx via SSM
  hosts: all
  become: true
  gather_facts: true

  vars:
    company_version: "devops-hardening-lab-platform:1.0.0"

  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Ensure custom listen directive is present
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        line: "        listen 8080;"
        insertafter: "^\\s*server {"

    - name: Start and enable nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Verify nginx responds locally on 8080
      ansible.builtin.uri:
        url: http://localhost:8080/
        status_code: 200
      register: nginx_check

    - name: Report result
      ansible.builtin.debug:
        msg: "nginx responded with status {{ nginx_check.status }}"
