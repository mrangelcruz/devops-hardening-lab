# Manually triggered only -- never runs automatically on push/PR.
#
# Flow (plan-before-apply):
#   1. `plan` always runs (plan role, no Environment gate) and prints the
#      full terraform plan for review.
#   2. `apply` runs only if the `apply` checkbox is checked, and only after
#      a required reviewer Approves the `production` GitHub Environment —
#      so approval happens *after* the plan is visible, not blind.
#
# The Environment protection rule is configured in repo Settings ->
# Environments (not by this file).
# Future: may also run Ansible configure steps after a successful apply.
name: Lab infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Check to apply (approval step after you run workflow); else plan.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: "us-west-2"
  TF_ENV_DIR: "terraform/environments/dev"
  # Known inputs for GitOps (repo Variables) — no terraform_remote_state
  TF_VAR_ssm_relay_bucket_arn: ${{ vars.SSM_RELAY_BUCKET_ARN }}

jobs:
  plan:
    name: Terraform plan (review before apply)
    runs-on: ubuntu-latest
    # No `environment:` here — must run without waiting so reviewers can
    # read the plan before deciding to Approve the apply job.
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Wrapper breaks `terraform apply tfplan` binary plans.
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC (plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Show plan (review this before Approving apply)
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform show -no-color tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ENV_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Terraform apply (gated — saved plan only)
    needs: plan
    # Checkbox default is false → plan-only. Checked → gated apply.
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    # Pauses here until a required reviewer Approves — *after* plan logs
    # and the tfplan artifact from the plan job are available.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Apply role: trusted only from this repo's production Environment.
      - name: Configure AWS credentials via OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ENV_DIR }}

      - name: Terraform apply (exact saved plan)
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -no-color tfplan

      - name: Print outputs
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform output
