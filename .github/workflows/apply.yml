# Manually triggered only -- never runs automatically on push/PR.
#
# Flow (plan before mutate):
#   1. `plan` always runs (plan role, no Environment gate).
#      - action=plan|apply → normal terraform plan (create/update preview)
#      - action=destroy    → terraform plan -destroy
#   2. If action is apply or destroy, the plan is uploaded and the gated
#      job waits for production Environment approval, then applies that
#      same-run tfplan. Plan-only runs do not upload an artifact.
#
# The Environment protection rule is configured in repo Settings ->
# Environments (not by this file).
# Future: may also run Ansible configure steps after a successful apply.
name: Lab infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan = preview only; apply / destroy = plan then gated mutate"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: "us-west-2"
  TF_ENV_DIR: "terraform/environments/dev"
  # Known inputs for GitOps (repo Variables) — no terraform_remote_state
  TF_VAR_ssm_relay_bucket_arn: ${{ vars.SSM_RELAY_BUCKET_ARN }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # No `environment:` here — must run without waiting so reviewers can
    # read the plan before deciding to Approve the mutate job.
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Wrapper breaks `terraform apply tfplan` binary plans.
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC (plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan (create/update)
        if: ${{ inputs.action != 'destroy' }}
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Terraform plan -destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform plan -destroy -no-color -out=tfplan

      - name: Show plan (review this in the logs)
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform show -no-color tfplan

      # Only when the gated job will download it in this same run.
      - name: Upload plan artifact
        if: ${{ inputs.action == 'apply' || inputs.action == 'destroy' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ENV_DIR }}/tfplan
          retention-days: 5

  mutate:
    name: Terraform apply saved plan (gated)
    needs: plan
    if: ${{ inputs.action == 'apply' || inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    # Pauses here until a required reviewer Approves — *after* plan logs
    # and the tfplan artifact from the plan job are available.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Apply role: trusted only from this repo's production Environment.
      - name: Configure AWS credentials via OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ENV_DIR }}

      - name: Terraform apply (exact saved plan)
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -no-color tfplan

      - name: Print outputs
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform output
